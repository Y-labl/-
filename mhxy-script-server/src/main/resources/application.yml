server:
  port: 8080

spring:
  application:
    name: mhxy-script
  main:
    banner-mode: off
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/mhxy_script?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mhxy.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

script:
  screenshot-path: ${user.dir}/screenshots
  template-path: ${user.dir}/templates
  match-threshold: 0.85
  screenshot-timeout: 5000
  click-interval: 300
  tesseract:
    datapath: D:/tessdata${user.dir}
    language: chi_sim+eng
  ocr:
    preprocess-scale: 0.7
    timeout-ms: 500

logging:
  level:
    com.mhxy: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"